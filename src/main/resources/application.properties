spring.application.name=collab-editor
# ?? Server ??????????????????????????????????????????

# ??? Server ???????????????????????????????????????????
server.port=8080

# ??? MongoDB ??????????????????????????????????????????
spring.data.mongodb.host=localhost
spring.data.mongodb.port=27017
spring.data.mongodb.database=collab_db

# ??? Redis ????????????????????????????????????????????
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ??? Logging (so we can see WebSocket activity) ???????
logging.level.com.collab=DEBUG
logging.level.org.springframework.web.socket=DEBUG

# Tell Spring Boot auto-config to skip Redis repository scanning
# We handle it manually in RedisConfig.java
spring.data.redis.repositories.enabled=false