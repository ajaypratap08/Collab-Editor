# ??? MongoDB ???????????????????????????????????????????????????????????????????
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/collabdb}

# ??? Redis ?????????????????????????????????????????????????????????????????????
spring.data.redis.host=${SPRING_DATA_REDIS_HOST:localhost}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD:}

# ??? Server ????????????????????????????????????????????????????????????????????
server.port=${PORT:8080}

# ??? Disable Redis repository auto-scan (we use Pub/Sub only, not Redis repos) ?
spring.data.redis.repositories.enabled=false

# ??? WebSocket ?????????????????????????????????????????????????????????????????
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536