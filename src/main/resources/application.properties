# ??? MongoDB ???????????????????????????????????????????????????????????????????
# Railway injects either MONGO_URL or MONGODB_URL depending on the template version
spring.data.mongodb.uri=${MONGO_URL:${MONGODB_URL:mongodb://localhost:27017/collabdb}}
spring.data.mongodb.database=collabdb

# ??? Redis ?????????????????????????????????????????????????????????????????????
# Railway automatically injects REDISHOST, REDISPORT, and REDISPASSWORD
spring.data.redis.host=${REDISHOST:localhost}
spring.data.redis.port=${REDISPORT:6379}
spring.data.redis.password=${REDISPASSWORD:}
spring.data.redis.url=${REDIS_URL:redis://localhost:6379}

# ??? Server ????????????????????????????????????????????????????????????????????
server.port=${PORT:8080}

# ??? Disable Redis repository auto-scan (we use Pub/Sub only, not Redis repos) ?
spring.data.redis.repositories.enabled=false

# ??? WebSocket ?????????????????????????????????????????????????????????????????
spring.websocket.max-text-message-size=65536
spring.websocket.max-binary-message-size=65536